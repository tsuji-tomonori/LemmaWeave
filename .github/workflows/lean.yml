name: Lean environment and audit fixtures

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install fixed elan release
        run: |
          mkdir -p "$RUNNER_TEMP/lemmaweave-elan"
          curl --fail --location --retry 2 --max-time 120 --output "$RUNNER_TEMP/lemmaweave-elan/elan.tar.gz" https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz
          sha256sum "$RUNNER_TEMP/lemmaweave-elan/elan.tar.gz"
          tar -xzf "$RUNNER_TEMP/lemmaweave-elan/elan.tar.gz" -C "$RUNNER_TEMP/lemmaweave-elan"
          "$RUNNER_TEMP/lemmaweave-elan/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install and observe the pinned Lean toolchain
        run: |
          python3 scripts/run.py --timeout 600 -- lean --version
          python3 scripts/run.py -- lake --version
      - name: Retrieve the pinned mathlib cache for all project imports
        run: python3 scripts/run.py --timeout 1800 -- lake exe cache get
      - name: Replay the complete fixed-environment pipeline
        run: python3 scripts/run.py --timeout 7200 -- python3 scripts/replay.py
      - name: Prepare compact CI diagnostics
        if: always()
        run: python3 scripts/collect_ci_diagnostics.py
      - name: Preserve compact CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-diagnostics-${{ github.sha }}
          path: |
            reports/ci-diagnostics.json
            reports/method-target-checkpoint.json
            reports/method-targets.json
            reports/method-target-selection.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-evidence-${{ github.sha }}
          path: |
            runs/
            work/*-graph.json
            work/*-locations.json
            work/locations.lean
            work/audit_*.lean
            reports/target-run-results.json
            reports/extractor-fixtures.json
            reports/inventory.json
            reports/declaration-index.csv
            reports/acceptance.json
            reports/metrics.json
            reports/method-recipes.json
            reports/method-targets.json
            reports/method-target-selection.json
            reports/method-batches.json
            reports/source-mapping.json
            knowledge/learning-graph.json
            knowledge/educational-frontier.json.gz
          retention-days: 14
